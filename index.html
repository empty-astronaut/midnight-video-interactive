/* Layout: a chunky late-80s handheld sitting on a dark table. Screen on top, D-pad and buttons below. Single committed dark look. */
:root {

* { box-sizing: border-box; }
body, .wrap, .shell, .result { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
body { touch-action: manipulation; }
html, body { background: var(--table); color: var(--bone); height: 100%; }
body { margin: 0; font-family: var(--f-pixel); padding-inline: 16px; padding-block: 12px 24px; overflow-x: hidden;

.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 10px; justify-items: center; }
.topline { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 640px; font-size: 9px; color: var(--bone-dim); letter-spacing: .05em; flex-wrap: wrap; gap: 6px; }
.topline b { color: var(--pink); font-weight: 400; text-shadow: 0 0 6px var(--pink); }
.shell { width: 100%; max-width: 640px; background: linear-gradient(180deg, var(--shell-light), var(--shell) 30%, var(--shell-dark)); border-radius: 18px 18px 48px 18px;
  padding: 18px 18px 22px; box-shadow: 0 30px 60px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08), inset 0 -3px 0 rgba(0,0,0,.5); display: grid; gap: 14px; }
.screen-bezel { background: var(--bezel); border-radius: 10px 10px 28px 10px; padding: 14px 14px 18px; box-shadow: inset 0 2px 8px rgba(0,0,0,.9); position: relative; }
.screen-bezel::after { content: "MIDNIGHT VIDEO \2022 RENTAL SYSTEM"; position: absolute; left: 20px; bottom: 4px; font-size: 7px; color: #4b4658; letter-spacing: .1em; }
.screen { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; overflow: hidden; border-radius: 3px; container-type: size; }
canvas#game { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
.scanlines { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.18) 2px 3px); mix-blend-mode: multiply; }
.glass { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.07), transparent 50%); }

.result { position: absolute; inset: 0; background: rgba(6,4,10,.92); display: grid; place-items: center; padding: 6px; overflow: hidden; font-size: 8px; font-size: clamp(6px, 2.3cqw, 9px); }
.result[hidden] { display: none; }
.card { width: 100%; max-width: 540px; max-height: 100%; overflow: hidden; border: 3px solid var(--bone); background: #120d16; padding: 1.2em; display: grid; gap: .8em; box-shadow: 0 0 0 3px #000, 0 0 24px rgba(255,79,216,.25); }
.card .label { font-size: .9em; color: var(--cyan); letter-spacing: .1em; }
.card h2 { font-size: 1.8em; margin: 0; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--bone); text-shadow: 2px 2px 0 var(--blood); }
.card .meta { font-size: 1em; color: var(--bone-dim); line-height: 1.9; }
.card .meta b { color: var(--bone); font-weight: 400; }

.dpad .c { left: 40px; top: 40px; background: #0d0b11; pointer-events: none; }
.ab { display: flex; gap: 14px; align-items: flex-end; transform: rotate(-12deg); }

.ab .b { background: radial-gradient(circle at 35% 30%, #8b7fe8, #4b3f9e 60%, #241c52); margin-bottom: 16px; }

.help { font-size: 8px; color: var(--bone-dim); line-height: 1.9; text-align: center; max-width: 640px; }
.help kbd { color: var(--bone); border: 1px solid #3a2f44; padding: 1px 4px; font-family: inherit; }

@media (prefers-reduced-motion: reduce) { .scanlines { display: none; } }
.card .pane[hidden] { display: none; }
</style>

<div class="wrap">
  <div class="topline"><span><b>MIDNIGHT VIDEO</b> &nbsp;open till dawn</span><span id="bagLine">BAG: empty</span></div>
  <div class="shell">
    <div class="screen-bezel">
      <div class="screen">
        <canvas id="game" width="320" height="240" aria-label="Midnight Video game screen"></canvas>
        <div class="scanlines" aria-hidden="true"></div>
        <div class="glass" aria-hidden="true"></div>
        <div class="result" id="result" hidden></div>
      </div>
    </div>
    <div class="controls">
      <div class="dpad" aria-label="Direction pad">
        <button class="u" data-k="up" aria-label="Up">&#9650;</button>
        <button class="l" data-k="left" aria-label="Left">&#9664;</button>
        <button class="c" tabindex="-1" aria-hidden="true"></button>
        <button class="r" data-k="right" aria-label="Right">&#9654;</button>
        <button class="d" data-k="down" aria-label="Down">&#9660;</button>
      </div>
      <div class="ab">
        <div><button class="b" data-k="b" aria-label="B button">B</button><small>CANCEL</small></div>
        <div><button class="a" data-k="a" aria-label="A button">A</button><small>ACTION</small></div>
      </div>
    </div>
  </div>
  <div class="help">Move: <kbd>arrows</kbd> or <kbd>WASD</kbd> &nbsp; Action: <kbd>Z</kbd> <kbd>Enter</kbd> <kbd>Space</kbd> &nbsp; Cancel: <kbd>X</kbd> <kbd>Esc</kbd> &nbsp; Sound: <kbd>M</kbd><br>Browse 12 shelves, carry up to 5 tapes, bring them to the counter. The clerk decides which one you keep... or take the Choice of the Day.</div>
</div>

  if (d) {
    player.dir = d; const [dx, dy] = DIRS[d]; const nx = player.x + dx, ny = player.y + dy;
    if (!blocked(nx, ny)) { player.x = nx; player.y = ny; player.moving = true; player.prog = 0; }
    else if (takePress(d)) sfx.bump();
  }
  if (takePress("a")) interact();
  if (takePress("b")) { if (bag.length) say({ text: `You're carrying ${bag.length} tape${bag.length > 1 ? "s" : ""}. Bring them to the counter at the top of the store.` }); else say({ text: "Your bag is empty. Walk up to a shelf and press A to grab a random tape." }); }
}
function facingTile() { const [dx, dy] = DIRS[player.dir]; return { x: player.x + dx, y: player.y + dy, ch: tileAt(player.x + dx, player.y + dy) }; }
function interact() {
  const f = facingTile(); const sh = shelfByCh[f.ch];
  if (cat.x === f.x && cat.y === f.y) { sfx.blip(); say({ text: rnd(["The cat stares through you.", "The cat is named Tracking. It does not come when called.", "The cat knocks nothing over, for now.", "It purrs like a VCR eating a tape."]) }); return; }
  if (sh) { sfx.blip(); browseShelf(sh); return; }
  if (f.ch === "C") { sfx.blip(); counter(); return; }
  if (f.ch === "T") { sfx.blip(); say({ text: rnd(["Two TVs playing static. For a second, something in the snow looked back.", "The top TV is tuned to channel 3. The bottom one is tuned to nothing.", "A sticker on the TV says DO NOT ADJUST."]) }); return; }
  if (f.ch === "P") { sfx.blip(); say({ text: "The plant died in 1987. Nobody has had the heart." }); return; }
  if (f.ch === "B") { sfx.blip(); say({ text: "A trash can full of rewound-wrong tapes and one sock." }); return; }
  if (f.ch === "N") { sfx.blip(); say({ text: rnd(["NEW RELEASES. Every tape on this wall is from 1988.", "A rack of returns nobody has reshelved. One of them is still warm.", "Staff picks. The staff is one guy and the cat."]) }); return; }
  if (f.ch === "K") { sfx.blip(); say({ text: "The clerk raises an eyebrow. 'Counter's right here, pal.'" }); return; }
  if (f.ch === "W" && f.y === ROWS - 1) { sfx.blip(); say({ text: rnd(["The HORROR sign buzzes like it has something to say.", "Posters for movies that never came out. One has your face on it.", "A poster: NOW HIRING. NIGHTS ONLY. MUST LIKE CATS."]) }); return; }
  if (f.ch === "W" && f.y === 0) { sfx.blip(); say({ text: rnd(["A poster for a movie that may not exist: SLEEP TIGHT 3.", "BE KIND. REWIND. Someone has crossed out KIND.", "A wall of staff picks. Every pick is the same movie."]) }); return; }
  if (f.ch === "D") { sfx.blip(); onDoor(true); return; }
}
function browseShelf(sh) {
  if (bag.length >= 5) { say({ text: "Your arms are full. Five tapes is the limit. Take them to the counter." }); return; }
  say({ text: `${sh.name} shelf. ${sh.films.length} tapes, labels worn off.\nGrab one blind?`, choices: ["Grab a tape", "Leave it"], onChoice: i => {
    if (i === 0) { const film = rnd(sh.films); bag.push({ film, shelf: sh }); sfx.pick(); updateBagLine();
      say({ text: `You pull a tape off the ${sh.name} shelf. ${rnd(["The label is torn off.", "It's warm. Why is it warm?", "The case rattles.", "Someone wrote STOP on the spine in marker.", "No label. Just a date: your birthday."])}\nBag: ${bag.length}/5.` }); }
  } });
}
function onDoor(ask) {
  if (!ask && player.dir !== "down") return;
  say({ text: "Head back out into the rain?", choices: ["Stay", "Leave"], onChoice: i => { if (i === 1) startFade(() => { state.scene = "intro"; intro = { t: 0, px: -20, phase: 0, doorOpen: 0, lightning: 0, flash: 0 }; bag = []; updateBagLine(); }); } });
}
function filmLine(f) { return `${f.title} (${f.year})  ${f.rating.toFixed(1)}/10`; }
function counter() {
  choiceOfDay = rnd(FILMS);
  if (!bag.length) {
    say([{ text: `The clerk looks up from a magazine.\n"Empty-handed? Fine. Skip the shelves, I'll pick for you."` },
      { text: `He reaches under the counter.\n"Tonight's Choice of the Day is...\n${filmLine(choiceOfDay)}."`, onShow: () => sfx.reveal() },
      { text: `"Take it, or go browse. It re-rolls every time you come back."`, choices: ["Take it", "Go browse"], onChoice: i => { if (i === 0) finish(choiceOfDay, "choice"); } }]);
    return;
  }
  const pages = [{ text: `The clerk dumps your bag on the counter.\n"Let's see what you've got."` }];
  bag.forEach((b, i) => pages.push({ text: `Tape ${i + 1} of ${bag.length} (${b.shelf.name}):\n${filmLine(b.film)}`, onShow: () => sfx.reveal() }));
  const allowed = rnd(bag);
  pages.push({ text: `"House rules. One rental per customer, and I pick which."\nThe clerk slides one tape back to you...` });
  pages.push({ text: `...${allowed.film.title} (${allowed.film.year}).\n"Or you can gamble on tonight's Choice of the Day. Any shelf, any rating. No peeking."`, onShow: () => sfx.sting() });
  pages.push({ text: `What'll it be?`, choices: [`Keep ${allowed.film.title.slice(0, 22)}`, "Choice of the Day", "Put them all back"], onChoice: i => {
    if (i === 0) finish(allowed.film, "kept");
    else if (i === 1) { say({ text: `The clerk reaches under the counter and hands you an unmarked tape.\n"Tonight's Choice of the Day is...\n${filmLine(choiceOfDay)}."`, onShow: () => sfx.reveal() }, () => finish(choiceOfDay, "choice")); }
    else { bag = []; updateBagLine(); say({ text: `"Suit yourself." The tapes go back on the cart.` }); }
  } });
  say(pages);
}
function finish(film, how) { bag = []; updateBagLine(); lastKept = film; showResult(film, how); }

// cat wander
function updateCat() {
  if (cat.moving) { cat.prog += .08; const [dx, dy] = [[0,-1],[0,1],[-1,0],[1,0]][cat.dir]; cat.px = (cat.x - dx * (1 - Math.min(1, cat.prog))) * T; cat.py = (cat.y - dy * (1 - Math.min(1, cat.prog))) * T; cat.frame = Math.floor(state.t / 8) % 2;
    if (cat.prog >= 1) { cat.moving = false; cat.px = cat.x * T; cat.py = cat.y * T; cat.wait = 40 + Math.random() * 120; } return; }
  if (--cat.wait > 0) return;
  const d = Math.floor(Math.random() * 4); const [dx, dy] = [[0,-1],[0,1],[-1,0],[1,0]][d]; const nx = cat.x + dx, ny = cat.y + dy;
  if (walkable(tileAt(nx, ny)) && tileAt(nx, ny) !== "D" && !(player.x === nx && player.y === ny) && !(player.moving && player.x === nx && player.y === ny)) { cat.dir = d; cat.x = nx; cat.y = ny; cat.moving = true; cat.prog = 0; } else cat.wait = 30;
}

function drawStore() {
  ctx.drawImage(BG, 0, 0);
  // neon inside sign on back wall
  ctx.font = '8px "Press Start 2P", monospace'; ctx.textBaseline = "top";
  if (flicker.neon > .35) { ctx.shadowColor = "#c8202c"; ctx.shadowBlur = 6; ctx.fillStyle = "#ffb3b8"; ctx.fillText("HORROR", 13 * T + 2, 13 * T + 5); ctx.shadowBlur = 0; ctx.fillStyle = "#ff3b47"; ctx.fillText("HORROR", 13 * T + 2, 13 * T + 5); } else { ctx.fillStyle = "#3a1012"; ctx.fillText("HORROR", 13 * T + 2, 13 * T + 5); }
  // TV static
  [[6 * T, 1 * T]].forEach(([x, y], i) => { px(x + 1, y + 1, 14, 14, "#2a2a30"); px(x + 2, y + 2, 12, 9, "#111"); for (let j = 0; j < 30; j++) { const v = Math.random(); px(x + 2 + Math.random() * 12, y + 2 + Math.random() * 9, 1, 1, v > .5 ? "#cfcfd8" : "#5a5a66"); } if (i === 0 && Math.floor(state.t / 40) % 9 === 0) { px(x + 6, y + 4, 2, 2, "#c8202c"); px(x + 9, y + 4, 2, 2, "#c8202c"); } px(x + 3, y + 12, 10, 2, "#1a1a20"); });
  // y-sorted entities
  const ents = [];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { const ch = MAP[y][x]; const sh = shelfByCh[ch];
    if (sh) { const v = MAP[y][x - 1] === ch && MAP[y][x + 1] === ch ? 1 : (MAP[y][x - 1] === ch ? 2 : 0); ents.push({ y: y * T + 16, draw: () => ctx.drawImage(sh.tiles[v], x * T, y * T - 6) }); }
    if (ch === "P") ents.push({ y: y * T + 16, draw: () => ctx.drawImage(PLANT, x * T + 3, y * T + 4) });
    if (ch === "B") ents.push({ y: y * T + 16, draw: () => ctx.drawImage(BIN, x * T + 3, y * T + 5) });
  }
  ents.push({ y: 1 * T + 16, draw: () => ctx.drawImage(CLERK, 2 * T + 2, 1 * T - 6) });
  ents.push({ y: cat.py + 16, draw: () => ctx.drawImage(CAT[cat.frame], cat.px + 3, cat.py + 6) });
  ents.push({ y: player.py + 16, draw: () => { ctx.drawImage(PLAYER[player.dir][player.frame], player.px + 2, player.py - 6); if (bag.length) ctx.drawImage(TAPE, player.px + (player.dir === "left" ? 0 : 8), player.py + 2); } });
  ents.sort((a, b) => a.y - b.y).forEach(e => e.draw());
  // aisle signs hanging above each shelf group
  ctx.font = '8px "Press Start 2P", monospace'; ctx.textBaseline = "top";
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { const sh = shelfByCh[MAP[y][x]]; if (!sh || MAP[y][x - 1] === sh.ch) continue;
    const w = sh.code.length * 8 + 6, sx = x * T + 24 - w / 2, sy = y * T - 14;
    px(sx, sy, w, 12, "#0a0a0c"); px(sx, sy, w, 1, sh.col); px(sx, sy + 11, w, 1, sh.col2);
    ctx.fillStyle = sh.col; ctx.fillText(sh.code, sx + 3, sy + 2); }
  // light flicker + vignette
  if (flicker.light < 1) { ctx.fillStyle = `rgba(0,0,0,${(1 - flicker.light) * .6})`; ctx.fillRect(0, 0, W, H); }
  const vg = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, 220); vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.55)"); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  // HUD bar
  px(0, 224, W, 16, "#0a0a0c"); px(0, 224, W, 1, "#2a2733");
  const f = facingTile(); const sh = shelfByCh[f.ch];
  let hint = sh ? `${sh.name}  [A] grab` : f.ch === "C" ? "COUNTER  [A] check out" : f.ch === "D" && player.dir === "down" ? "EXIT  [A] leave" : (cat.x === f.x && cat.y === f.y) ? "CAT  [A] pet" : "";
  text(hint, 4, 228, sh ? sh.col : "#9a93a3");
  for (let i = 0; i < 5; i++) { if (i < bag.length) ctx.drawImage(TAPE, 266 + i * 10, 229); else px(266 + i * 10, 229, 8, 5, "#1d1a24"); }
  if (toast) { const w = toast.text.length * 8 + 12; px((W - w) / 2, 200, w, 16, "rgba(10,10,12,.9)"); text(toast.text, (W - w) / 2 + 6, 204, "#ff4fd8"); if (--toast.t <= 0) toast = null; }
}

// =============== DIALOG ===============
function updateDialog() {
  const pg = dialog.pages[dialog.i]; const lines = wrap(pg.text, 36); const total = lines.join("\n").length;
  if (pg.onShow && !pg.shownOnce) { pg.shownOnce = true; pg.onShow(); }
  if (dialog.shown < total) { dialog.shown += 2; if (takePress("a") || takePress("b")) dialog.shown = total; return; }
  if (pg.choices) {
    if (takePress("up")) { dialog.sel = (dialog.sel + pg.choices.length - 1) % pg.choices.length; sfx.blip(); }
    if (takePress("down")) { dialog.sel = (dialog.sel + 1) % pg.choices.length; sfx.blip(); }
    if (takePress("b")) { sfx.cancel(); const sel = pg.choices.length - 1; closeDialog(); if (pg.onChoice) pg.onChoice(sel); return; }
    if (takePress("a")) { const sel = dialog.sel; sfx.blip(); closeDialog(); if (pg.onChoice) pg.onChoice(sel); return; }
    return;
  }
  if (takePress("a") || takePress("b")) { sfx.blip(); dialog.i++; dialog.shown = 0; dialog.sel = 0; if (dialog.i >= dialog.pages.length) { const after = dialog.after; closeDialog(); if (after) after(); } }
}
function closeDialog() { dialog = null; if (state.scene === "dialog") state.scene = "store"; }
function drawDialog() {
  drawStore();
  const pg = dialog.pages[dialog.i]; const lines = wrap(pg.text, 36);
  const choiceH = pg.choices ? pg.choices.length * 12 + 6 : 0; const h = lines.length * 12 + 16 + choiceH; const y = 224 - h - 4;
  px(4, y, W - 8, h, "#0a0a0c"); px(4, y, W - 8, 2, "#e9e1d2"); px(4, y + h - 2, W - 8, 2, "#e9e1d2"); px(4, y, 2, h, "#e9e1d2"); px(W - 6, y, 2, h, "#e9e1d2");
  let shown = dialog.shown; lines.forEach((l, i) => { const s = l.slice(0, Math.max(0, shown)); shown -= l.length + 1; text(s, 12, y + 8 + i * 12); });
  const full = dialog.shown >= lines.join("\n").length;
  if (full && pg.choices) pg.choices.forEach((c, i) => { text(c, 24, y + 12 + lines.length * 12 + i * 12, i === dialog.sel ? "#ff4fd8" : "#9a93a3"); if (i === dialog.sel) text(">", 12, y + 12 + lines.length * 12 + i * 12, "#ff4fd8"); });
  else if (full && Math.floor(state.t / 20) % 2 === 0) text("▼", W - 20, y + h - 12, "#ff4fd8");
}

// =============== RESULT OVERLAY ===============
const resultEl = document.getElementById("result");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function skulls(r) { const n = Math.max(1, Math.min(5, Math.round((r - 5) / 0.7))); return "☠".repeat(n) + "<span style='opacity:.25'>" + "☠".repeat(5 - n) + "</span>"; }
function showResult(f, how) {
  state.scene = "result";
  const q = encodeURIComponent(`${f.title} ${f.year}`);
  resultEl.innerHTML = `<div class="card">
    <div class="label">${how === "choice" ? "CHOICE OF THE DAY" : "THE CLERK LET YOU KEEP"}</div>
    <h2>${esc(f.title)}</h2>
    <div class="pane" id="paneMain"><div class="meta"><b>${f.year}</b> &middot; <b>${f.runtime} min</b> &middot; dir. <b>${esc(f.director)}</b><br>IMDb <b>${f.rating.toFixed(1)}</b> <span class="skulls">${skulls(f.rating)}</span></div></div>
    <div class="pane" id="paneDetails" hidden><p>${esc(f.logline)}</p><div class="tags">${f.tags.map(t => G[t] ? `<span class="tag">${G[t]}</span>` : "").join("")}</div></div>
    <div class="acts">
      <button class="pbtn" type="button" id="detailsBtn">Details</button>
      <a class="pbtn primary" href="https://www.imdb.com/find/?q=${q}&s=tt&ttype=ft" target="_blank" rel="noopener">IMDb</a>
      <a class="pbtn" href="https://www.justwatch.com/us/search?q=${encodeURIComponent(f.title)}" target="_blank" rel="noopener">Stream</a>
      <button class="pbtn" type="button" id="againBtn">Back [B]</button>
    </div>
    <div class="label" style="color:#9a93a3">&larr; &rarr; pick &middot; A select &middot; B back. Due back by dawn.</div>
  </div>`;
  resultEl.hidden = false;
  document.getElementById("againBtn").addEventListener("click", hideResult);
  document.getElementById("detailsBtn").addEventListener("click", toggleDetails);
  resultSel = 0; markResult();
}
let resultSel = 2;
function resultBtns() { return [...resultEl.querySelectorAll(".pbtn")]; }
function markResult() { resultBtns().forEach((b, i) => b.classList.toggle("sel", i === resultSel)); }
function toggleDetails() { const m = document.getElementById("paneMain"), dd = document.getElementById("paneDetails"); const open = dd.hidden; dd.hidden = !open; m.hidden = open; document.getElementById("detailsBtn").textContent = open ? "Less" : "Details"; sfx.blip(); }
function hideResult() { resultEl.hidden = true; state.scene = "store"; showToast("Choice of the Day re-rolled."); }
function updateResult() {
  const btns = resultBtns(); if (!btns.length) return;
  if (takePress("left") || takePress("up")) { resultSel = (resultSel + btns.length - 1) % btns.length; sfx.blip(); markResult(); }
  if (takePress("right") || takePress("down")) { resultSel = (resultSel + 1) % btns.length; sfx.blip(); markResult(); }
  if (takePress("a")) { const b = btns[resultSel]; if (b.id === "againBtn") hideResult(); else if (b.id === "detailsBtn") toggleDetails(); else { sfx.blip(); b.click(); } }
  if (takePress("b")) hideResult();
}
function updateBagLine() { document.getElementById("bagLine").textContent = bag.length ? `BAG: ${bag.map(b => b.shelf.name.split(" ")[0]).join(", ")}` : "BAG: empty"; }

// =============== LOOP ===============
function updateFlicker() {
  if (Math.random() < .02) flicker.light = .4 + Math.random() * .4; else flicker.light = Math.min(1, flicker.light + .1);
  if (Math.random() < .03) flicker.neon = Math.random(); else flicker.neon = Math.min(1, flicker.neon + .08);
  if (Math.random() < .08) { const i = Math.floor(Math.random() * 14); flicker.sign[i] = Math.random() < .5 ? 0 : 1; }
  flicker.sign = flicker.sign.map(v => v < 1 && Math.random() < .3 ? 1 : v);
}
let last = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (ts - last < 1000 / 60) return; last = ts; state.t++;
  updateFlicker(); updateFade();
  if (state.scene === "intro") { updateIntro(); drawIntro(); }
  else if (state.scene === "loading") { drawLoading(); }
  else if (state.scene === "store") { if (fadeDir === 0) updatePlayer(); updateCat(); drawStore(); }
  else if (state.scene === "dialog") { updateDialog(); updateCat(); if (dialog) drawDialog(); else drawStore(); }
  else if (state.scene === "result") { updateResult(); drawStore(); }
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
  pressed.length = 0;
}
updateBagLine();
const start = () => requestAnimationFrame(loop);
if (document.fonts && document.fonts.load) { Promise.race([document.fonts.load('8px "Press Start 2P"'), new Promise(r => setTimeout(r, 1500))]).then(start, start); } else start();
})();
</script>
